apiVersion: v1
kind: ConfigMap
metadata:
  name: sounio-stroke-runtime
  namespace: darwin-genomics
data:
  SOUNIO_STROKE_OBJECT_STORE: minio
  SOUNIO_STROKE_JOB_BACKEND: kubernetes
  SOUNIO_STROKE_AGENT_BACKEND: kubernetes
  SOUNIO_STROKE_K8S_NAMESPACE: darwin-genomics
  SOUNIO_STROKE_K8S_LOCAL_QUEUE: darwin-lab
  SOUNIO_STROKE_K8S_WORKER_IMAGE: ghcr.io/agourakis82/sounio-stroke-lab-worker:latest
  SOUNIO_STROKE_K8S_DATASET_PVC: sounio-stroke-datasets
  SOUNIO_STROKE_K8S_SERVICE_ACCOUNT: sounio-stroke-runner
  SOUNIO_STROKE_K8S_SHARED_PATH_PREFIXES: /datasets
  SOUNIO_STROKE_MINIO_ENDPOINT: minio.darwin-genomics.svc.cluster.local:9000
  SOUNIO_STROKE_MINIO_BUCKET: sounio-stroke-lab
