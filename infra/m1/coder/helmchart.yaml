apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: coder
  namespace: kube-system
spec:
  repo: https://helm.coder.com/v2
  chart: coder
  targetNamespace: coder
  createNamespace: true
  valuesContent: |-
    coder:
      env:
        - name: CODER_ACCESS_URL
          value: https://coder.lab.internal
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
            secretKeyRef:
              name: coder-db-url
              key: url
    ingress:
      enable: true
      className: traefik
      host: coder.lab.internal
      tls:
        enable: true
