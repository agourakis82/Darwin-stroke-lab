apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: proxmox-cephfs
provisioner: cephfs.csi.ceph.com
parameters:
  clusterID: f591bae9-eec5-4ae0-abfe-466ed7528c9e
  fsName: cephfs
  pool: cephfs_data
  subvolumeGroup: csi
  csi.storage.k8s.io/provisioner-secret-name: ceph-csi-cephfs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: storage-system
  csi.storage.k8s.io/controller-expand-secret-name: ceph-csi-cephfs-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: storage-system
  csi.storage.k8s.io/node-stage-secret-name: ceph-csi-cephfs-secret
  csi.storage.k8s.io/node-stage-secret-namespace: storage-system
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: proxmox-ceph-rbd
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: f591bae9-eec5-4ae0-abfe-466ed7528c9e
  pool: rbd_ssd
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: ceph-csi-rbd-secret
  csi.storage.k8s.io/provisioner-secret-namespace: storage-system
  csi.storage.k8s.io/controller-expand-secret-name: ceph-csi-rbd-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: storage-system
  csi.storage.k8s.io/node-stage-secret-name: ceph-csi-rbd-secret
  csi.storage.k8s.io/node-stage-secret-namespace: storage-system
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
