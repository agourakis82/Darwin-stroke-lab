apiVersion: v1
kind: Secret
metadata:
  name: lab-postgres-app
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: REPLACE_WITH_CNPG_BOOTSTRAP_OWNER_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-db-url
  namespace: coder
type: Opaque
stringData:
  url: postgresql://coder:REPLACE_WITH_CODER_DB_PASSWORD@lab-postgres-rw.postgres.svc.cluster.local:5432/coder
  username: coder
  password: REPLACE_WITH_CODER_DB_PASSWORD
  database: coder
  host: lab-postgres-rw.postgres.svc.cluster.local
  port: "5432"
---
