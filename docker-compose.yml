services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stroke_lab
      POSTGRES_USER: stroke
      POSTGRES_PASSWORD: stroke
    ports:
      - "${SOUNIO_STROKE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroke -d stroke_lab"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${SOUNIO_STROKE_MINIO_API_HOST_PORT:-9000}:9000"
      - "${SOUNIO_STROKE_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 1; done &&
      mc mb --ignore-existing local/sounio-stroke-lab
      "

  api:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: uvicorn sounio_stroke_lab.main:app --host 0.0.0.0 --port 8000
    environment:
      SOUNIO_STROKE_DATA_DIR: /var/lib/sounio-stroke-lab
      SOUNIO_STROKE_DB_URL: postgresql://stroke:stroke@postgres:5432/stroke_lab
      SOUNIO_STROKE_OBJECT_STORE: minio
      SOUNIO_STROKE_MINIO_ENDPOINT: http://minio:9000
      SOUNIO_STROKE_MINIO_ACCESS_KEY: minio
      SOUNIO_STROKE_MINIO_SECRET_KEY: minio123
      SOUNIO_STROKE_MINIO_BUCKET: sounio-stroke-lab
      SOUNIO_STROKE_JOB_BACKEND: local
      SOUNIO_STROKE_START_EMBEDDED_BENCHMARK_WORKER: "0"
    ports:
      - "${SOUNIO_STROKE_API_HOST_PORT:-8000}:8000"
    volumes:
      - stroke-storage:/var/lib/sounio-stroke-lab
      - .:/workspace
    working_dir: /workspace

  benchmark-worker:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sounio-stroke-lab run-benchmark-worker --poll-interval 0.1
    environment:
      SOUNIO_STROKE_DATA_DIR: /var/lib/sounio-stroke-lab
      SOUNIO_STROKE_DB_URL: postgresql://stroke:stroke@postgres:5432/stroke_lab
      SOUNIO_STROKE_OBJECT_STORE: minio
      SOUNIO_STROKE_MINIO_ENDPOINT: http://minio:9000
      SOUNIO_STROKE_MINIO_ACCESS_KEY: minio
      SOUNIO_STROKE_MINIO_SECRET_KEY: minio123
      SOUNIO_STROKE_MINIO_BUCKET: sounio-stroke-lab
      SOUNIO_STROKE_JOB_BACKEND: local
      SOUNIO_STROKE_START_EMBEDDED_BENCHMARK_WORKER: "0"
    volumes:
      - stroke-storage:/var/lib/sounio-stroke-lab
      - .:/workspace
    working_dir: /workspace

volumes:
  postgres-data:
  minio-data:
  stroke-storage:
